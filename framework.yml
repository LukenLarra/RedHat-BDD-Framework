# Stack-Agnostic Framework Configuration
# ========================================

# Project Metadata
project:
  name: "RedHat-BDD-Framework"
  version: "1.0.0"

# Installation Configuration
# Sequential installation steps with explicit order
installation:
  steps:
    - name: Install API deps
      path: backend
      command: pip install -r requirements.txt
      service: api

    - name: Install Web deps
      path: frontend
      command: npm install
      service: web

    - name: Install Test deps
      path: tests
      command: pip install -r requirements.txt

# Services Configuration
# Define any type of service (api, web, database, cache, worker, etc.)
services:
  api:
    enabled: true
    path: "backend"
    start_command: "python app.py"
    host: "0.0.0.0"
    port: 5000
    health_check:
      enabled: true
      url: "http://localhost:5000/health"
      timeout: 30
      interval: 1
    env:
      FLASK_APP: "app.py"
      FLASK_ENV: "development"
      FLASK_DEBUG: "0"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/movies_db"
    dependencies: []

  web:
    enabled: true
    path: "frontend"
    start_command: "node server.js"
    port: 3000
    health_check:
      enabled: true
      url: "http://localhost:3000"
      timeout: 30
      interval: 1
    env:
      PORT: "3000"
      NODE_ENV: "development"
      API_URL: "http://localhost:5000"
    dependencies: ["api"]

# Test Configuration
# BDD tests are written in Python/Behave, but they test applications in ANY language
# The framework orchestrates services via commands - it doesn't care about implementation details
tests:
  enabled: true
  path: "tests"
  command: "python run_bdd_tests.py --no-capture --format pretty"
  bdd:
    features: "tests/features"
    steps: "tests/features/steps"
    environment: "tests/features/environment.py"
  env:
    API_URL: "http://localhost:5000"

# General Configuration
general:
  stop_on_test_failure: false
  cleanup_on_exit: true
  log_level: "INFO"
  startup_delay: 2

# Profiles Configuration
# Override any configuration based on execution context
profiles:
  ci:
    services:
      api:
        health_check:
          timeout: 60
          interval: 2
        env:
          FLASK_ENV: "production"
      web:
        health_check:
          timeout: 60
          interval: 2
        env:
          NODE_ENV: "test"
    tests:
      command: "python run_bdd_tests.py --junit --junit-directory reports/junit --format pretty"
    general:
      startup_delay: 5
      stop_on_test_failure: true

  debug:
    services:
      api:
        env:
          FLASK_DEBUG: "1"
    tests:
      command: "python run_bdd_tests.py --no-capture --verbose"
    general:
      log_level: "DEBUG"
      cleanup_on_exit: false
