# Configuración del Framework BDD
# =================================

# Configuración del Backend
backend:
  enabled: true
  type: "python"
  path: "backend"
  script: "app.py"
  host: "0.0.0.0"
  port: 5000
  health_check:
    enabled: true
    url: "http://localhost:5000/health"
    timeout: 30
    interval: 1
  env:
    FLASK_APP: "app.py"
    FLASK_ENV: "development"
    FLASK_DEBUG: "0"
    FLASK_HOST: "0.0.0.0"
    FLASK_PORT: "5000"
    DATABASE_URL: "sqlite:///movies.db"

# Configuración del Frontend
frontend:
  enabled: true
  type: "node"
  path: "frontend"
  script: "server.js"
  port: 3000
  health_check:
    enabled: true
    url: "http://localhost:3000"
    timeout: 30
    interval: 1
  env:
    PORT: "3000"
    NODE_ENV: "development"
    API_URL: "http://localhost:5000"

# Configuración de los Tests BDD
tests:
  enabled: true
  type: "behave"
  path: "tests"
  script: "run_bdd_tests.py"
  wait_for_services: true
  env:
    API_URL: "http://localhost:5000"
  behave_args:
    - "--no-capture"
    - "--no-capture-stderr"
    - "--format=pretty"

# Configuración General
general:
  stop_on_test_failure: false
  cleanup_on_exit: true
  log_level: "INFO"
  startup_delay: 2

# Perfiles opcionales (sin cambiar estructura base)
profiles:
  ci:
    backend:
      health_check:
        timeout: 60
        interval: 2
      env:
        FLASK_ENV: "production"
    frontend:
      health_check:
        timeout: 60
        interval: 2
      env:
        NODE_ENV: "test"
    tests:
      behave_args:
        - "--format=json"
        - "--outfile=reports/behave-results.json"
        - "--format=junit"
        - "--junit-directory=reports/junit"
    general:
      startup_delay: 5
      stop_on_test_failure: true

  debug:
    backend:
      env:
        FLASK_DEBUG: "1"
    tests:
      behave_args:
        - "--no-capture"
        - "--verbose"
    general:
      log_level: "DEBUG"
      cleanup_on_exit: false
