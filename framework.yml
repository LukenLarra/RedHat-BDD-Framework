# Stack-Agnostic BDD Framework Configuration
# ============================================
#
# This file configures ONLY the test execution.
# Your services (backend, frontend, etc.) must be started in your CI workflow
# before calling this framework — see ci_example.yml for a complete reference.

# Project Metadata
project:
  name: "RedHat-BDD-Framework"
  version: "2.0.0"

# Test Configuration
# Adapt 'command' and 'env' to match your project's test setup.
tests:
  enabled: true
  path: "tests"
  command: "python run_bdd_tests.py --junit --junit-directory reports/junit --format pretty"
  bdd:
    features: "tests/features"
    steps: "tests/features/steps"
    environment: "tests/features/environment.py"
  env:
    API_URL: "http://localhost:8000"
