# Pre-commit configuration for RedHat BDD Framework
# ==================================================
# Para instalar:
#   1. pip install pre-commit
#   2. pre-commit install
#
# Para ejecutar manualmente:
#   pre-commit run --all-files
#
# Para actualizar hooks:
#   pre-commit autoupdate

repos:
  # Hooks generales para todos los archivos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Elimina espacios en blanco al final de las líneas
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Asegura que los archivos terminen con una línea vacía
      - id: end-of-file-fixer
      # Verifica la sintaxis de archivos YAML
      - id: check-yaml
        args: [--unsafe] # Permite tags personalizados de YAML
      # Verifica la sintaxis de archivos JSON
      - id: check-json
      # Previene commits de archivos grandes
      - id: check-added-large-files
        args: [--maxkb=500]
      # Verifica que no haya conflictos de merge
      - id: check-merge-conflict
      # Previene commits directos a main/master
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      # Limpia archivos de requisitos de Python
      - id: requirements-txt-fixer

  # Python - Linter y formateador con Ruff (reemplaza black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      # Linting y auto-fix
      - id: ruff
        args: [--fix]
      # Formateo de código (reemplaza black)
      - id: ruff-format

  # JavaScript/JSON/CSS/HTML - Formateo con Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (JS/JSON/CSS/HTML formatter)
        types_or: [javascript, jsx, json, css, html, markdown]
        args: [--print-width=100, --trailing-comma=es5]
        exclude: ^(node_modules/|frontend/node_modules/|package-lock\.json)

  # Markdown - Linting (Deshabilitado temporalmente - requiere npm install --save-dev markdownlint-cli)
  # - repo: https://github.com/igorshubovych/markdownlint-cli
