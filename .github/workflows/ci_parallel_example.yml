name: CI_Parallel_Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Cantidad máxima de ejecuciones simultáneas"
        required: false
        type: number
        default: 256

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # === 1. DISCOVERY JOB ===
  discovery:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover BDD Features
        id: discover
        uses: ./discovery # LukenLarra/RedHat-BDD-Framework/discovery@main

  # === 2. PARALLEL RUNNER JOB ===
  bdd-tests-parallel:
    needs: discovery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '256') }}
      matrix:
        feature_file: ${{ fromJson(needs.discovery.outputs.matrix) }}

    # ─── Services and containers ───────────────────────────────────────
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movies_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/movies_db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 1. Set up your environment ───────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      # ─── 2. Install YOUR project dependencies ─────────────────────────
      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ─── 3. Start custom services ─────────────────────────────────────
      - name: Start backend
        run: python backend/app.py &
        env:
          API_HOST: "0.0.0.0"
          API_PORT: "8000"
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "Backend ready" && break
            echo "  attempt $i/30..."
            sleep 1
          done

      - name: Start frontend
        run: node server.js &
        working-directory: frontend
        env:
          PORT: "3000"
          NODE_ENV: "development"
          API_URL: "http://localhost:8000"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && echo "Frontend ready" && break
            echo "  attempt $i/30..."
            sleep 2
          done

      # ─── 4. Run the framework ─────────────────────────────────────────
      - name: Run BDD Framework (Parallel)
        uses: ./ #LukenLarra/RedHat-BDD-Framework@main
        with:
          service: "movies-api"
          feature_file: ${{ matrix.feature_file }}
          publish_results: "false"
          artifact_name_suffix: "-${{ strategy.job-index }}"

  # === 3. PUBLISH AGGREGATED REPORT ===
  publish_report:
    name: Publish Test Results
    needs: bdd-tests-parallel
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download partial reports
        uses: actions/download-artifact@v4
        with:
          pattern: bdd-test-reports-movies-api-*
          path: reports/junit
          merge-multiple: true

      - name: Publish merged test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit/*.xml
