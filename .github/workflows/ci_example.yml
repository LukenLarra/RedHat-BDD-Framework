name: CI_Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  bdd-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movies_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/movies_db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Set up your runtime ──────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      # ── 2. Install YOUR project dependencies ───────────────────────────────
      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── 3. Start YOUR application services ──────────────────────────────────
      # Start services from your own code here. The framework does not manage
      # services — it only runs behave. Use &, Docker Compose, or any other
      # mechanism that fits your stack.
      - name: Start backend
        run: python backend/app.py &
        env:
          API_HOST: "0.0.0.0"
          API_PORT: "8000"
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "Backend ready" && break
            echo "  attempt $i/30..."
            sleep 1
          done

      - name: Start frontend
        run: node server.js &
        working-directory: frontend
        env:
          PORT: "3000"
          NODE_ENV: "development"
          API_URL: "http://localhost:8000"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && echo "Frontend ready" && break
            echo "  attempt $i/30..."
            sleep 2
          done

      # ── 4. Call the framework — DATABASE_URL is inherited from the job env ──
      - name: Run BDD Framework
        uses: ./ #LukenLarra/RedHat-BDD-Framework@main
        with:
          service: "movies-api"
