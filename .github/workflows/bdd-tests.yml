name: Run BDD Tests (Reusable)

# Reusable workflow: only callable from another workflow.
# The caller is responsible for installing all dependencies and saving them
# to cache. This workflow restores that cache and runs the BDD framework,
# remaining fully agnostic to language, runtime, and database technology.

on:
  workflow_call:
    inputs:
      # ── Artifact & framework config ───────────────────────────────────────
      service:
        description: "Service name used for artifact naming"
        required: false
        type: string
        default: "bdd-framework"
      artifacts_log_dir:
        description: "Directory where test reports are written (relative to reports/)"
        required: false
        type: string
        default: "junit"
      bdd_config:
        description: "Path to the BDD framework config file"
        required: false
        type: string
        default: "framework.yml"

      # ── Dependency cache (populated by the caller) ────────────────────────
      cache_key:
        description: "Cache key for restoring backend/test dependencies (e.g. pip venv)"
        required: true
        type: string
      cache_path:
        description: "Cache path for backend/test dependencies (e.g. .venv)"
        required: true
        type: string
      secondary_cache_key:
        description: "Cache key for restoring frontend dependencies (optional)"
        required: false
        type: string
        default: ""
      secondary_cache_path:
        description: "Cache path for frontend dependencies (optional, e.g. frontend/node_modules)"
        required: false
        type: string
        default: ""

      # ── Python virtual environment ────────────────────────────────────────
      python_venv_path:
        description: >
          Path to the Python virtual environment to activate (adds <path>/bin to PATH).
          Set to '' to skip activation (e.g. when using pip --user install).
        required: false
        type: string
        default: ".venv"

      # ── Database configuration ────────────────────────────────────────────
      db_enabled:
        description: "Whether to start a database container"
        required: false
        type: boolean
        default: true
      db_image:
        description: "Docker image for the database (e.g. postgres:15-alpine, mysql:8, mongo:7)"
        required: false
        type: string
        default: "postgres:15-alpine"
      db_name:
        description: "Database name to create"
        required: false
        type: string
        default: "app_db"
      db_port:
        description: "Port to expose the database container on"
        required: false
        type: string
        default: "5432"
      database_url:
        description: "Full connection string injected as DATABASE_URL environment variable"
        required: false
        type: string
        default: ""

    secrets:
      db_user:
        description: "Database user (optional, falls back to 'postgres')"
        required: false
      db_password:
        description: "Database password"
        required: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  bdd_tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ inputs.database_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Restore dependency caches prepared by the caller ──────────────────

      - name: Restore primary cache (backend/test dependencies)
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache_path }}
          key: ${{ inputs.cache_key }}

      - name: Restore secondary cache (frontend dependencies)
        if: inputs.secondary_cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.secondary_cache_path }}
          key: ${{ inputs.secondary_cache_key }}

      - name: Activate Python virtual environment
        if: inputs.python_venv_path != ''
        run: echo "$GITHUB_WORKSPACE/${{ inputs.python_venv_path }}/bin" >> $GITHUB_PATH

      # ── Database ──────────────────────────────────────────────────────────

      - name: Start database container
        if: inputs.db_enabled
        env:
          DB_USER: ${{ secrets.db_user }}
          DB_PASSWORD: ${{ secrets.db_password }}
        run: |
          docker run -d --name testdb \
            -e POSTGRES_USER=${DB_USER:-postgres} \
            -e POSTGRES_PASSWORD=${DB_PASSWORD:-postgres} \
            -e POSTGRES_DB=${{ inputs.db_name }} \
            -e MYSQL_USER=${DB_USER:-app} \
            -e MYSQL_PASSWORD=${DB_PASSWORD:-app} \
            -e MYSQL_DATABASE=${{ inputs.db_name }} \
            -e MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root} \
            -e MONGO_INITDB_DATABASE=${{ inputs.db_name }} \
            -p ${{ inputs.db_port }}:${{ inputs.db_port }} \
            ${{ inputs.db_image }}

      - name: Wait for database to be ready
        if: inputs.db_enabled
        run: |
          echo "Waiting for database on port ${{ inputs.db_port }}..."
          for i in $(seq 1 30); do
            if nc -z localhost ${{ inputs.db_port }} 2>/dev/null; then
              echo "✅ Database is ready (port ${{ inputs.db_port }} open)"
              exit 0
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done
          echo "❌ Database did not become ready in time"
          docker logs testdb
          exit 1

      # ── Run framework & collect results ───────────────────────────────────

      - name: Run BDD Framework
        run: python bdd_framework.py --config ${{ inputs.bdd_config }}

      - name: Check for test reports
        id: check_reports
        if: always()
        run: |
          if [ -d "reports/${{ inputs.artifacts_log_dir }}" ] && [ -n "$(ls -A reports/${{ inputs.artifacts_log_dir }}/*.xml 2>/dev/null)" ]; then
            echo "reports_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Test reports found"
            ls -lh reports/${{ inputs.artifacts_log_dir }}/
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️  No test reports generated"
          fi

      - name: Upload test reports
        if: always() && steps.check_reports.outputs.reports_exist == 'true' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-reports-${{ inputs.service }}
          path: reports/${{ inputs.artifacts_log_dir }}
          retention-days: 30

      - name: Publish test results
        if: always() && steps.check_reports.outputs.reports_exist == 'true' && !env.ACT
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/${{ inputs.artifacts_log_dir }}/*.xml
