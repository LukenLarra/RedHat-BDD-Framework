name: Run BDD Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  bdd_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movies_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/movies_db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install Frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Test dependencies
        run: pip install -r requirements.txt
        working-directory: tests

      - name: Install Framework dependencies
        run: pip install -r requirements.txt

      - name: Run BDD Framework
        run: python bdd_framework.py --config framework.yml

      - name: Check for test reports
        id: check_reports
        if: always()
        run: |
          if [ -d "reports/junit" ] && [ -n "$(ls -A reports/junit/*.xml 2>/dev/null)" ]; then
            echo "reports_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Test reports found"
            ls -lh reports/junit/
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️  No test reports generated"
          fi

      - name: Upload test reports
        if: always() && steps.check_reports.outputs.reports_exist == 'true' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-reports
          path: reports/
          retention-days: 30

      - name: Publish test results
        if: always() && steps.check_reports.outputs.reports_exist == 'true' && !env.ACT
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit/*.xml
