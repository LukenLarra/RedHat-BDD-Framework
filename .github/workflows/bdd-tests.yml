name: Run BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service name"
        required: false
        type: string
        default: "bdd-framework"
      artifacts_log_dir:
        description: "Artifacts log directory"
        required: false
        type: string
        default: "junit"
      postgres_db:
        description: "PostgreSQL database name"
        required: false
        type: string
        default: "movies_db"
      bdd_config:
        description: "BDD framework config file"
        required: false
        type: string
        default: "framework.yml"
      has_frontend:
        description: "Whether the service has a frontend"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      service:
        required: false
        type: string
        default: "bdd-framework"
      artifacts_log_dir:
        required: false
        type: string
        default: "junit"
      postgres_db:
        required: false
        type: string
        default: "movies_db"
      bdd_config:
        required: false
        type: string
        default: "framework.yml"
      has_frontend:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  bdd_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres_db || 'movies_db' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/${{ inputs.postgres_db || 'movies_db' }}"

    steps:
      - name: Set variables
        id: vars
        run: |
          echo "service=${{ inputs.service || 'bdd-framework' }}" >> $GITHUB_OUTPUT
          echo "artifacts_log_dir=${{ inputs.artifacts_log_dir || 'junit' }}" >> $GITHUB_OUTPUT
          echo "bdd_config=${{ inputs.bdd_config || 'framework.yml' }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js
        if: ${{ inputs.has_frontend != false }}
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install Frontend dependencies
        if: ${{ inputs.has_frontend != false }}
        run: npm install
        working-directory: frontend

      - name: Install Test dependencies
        run: pip install -r requirements.txt
        working-directory: tests

      - name: Install Framework dependencies
        run: pip install -r requirements.txt

      - name: Run BDD Framework
        run: python bdd_framework.py --config ${{ steps.vars.outputs.bdd_config }}

      - name: Check for test reports
        id: check_reports
        if: always()
        run: |
          if [ -d "reports/${{ steps.vars.outputs.artifacts_log_dir }}" ] && [ -n "$(ls -A reports/${{ steps.vars.outputs.artifacts_log_dir }}/*.xml 2>/dev/null)" ]; then
            echo "reports_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Test reports found"
            ls -lh reports/${{ steps.vars.outputs.artifacts_log_dir }}/
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️  No test reports generated"
          fi

      - name: Upload test reports
        if: always() && steps.check_reports.outputs.reports_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-reports-${{ steps.vars.outputs.service }}
          path: reports/${{ steps.vars.outputs.artifacts_log_dir }}
          retention-days: 30

      - name: Publish test results
        if: always() && steps.check_reports.outputs.reports_exist == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/${{ steps.vars.outputs.artifacts_log_dir }}/*.xml
