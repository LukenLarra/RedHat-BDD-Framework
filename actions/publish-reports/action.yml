name: "RedHat BDD Framework - Publish Reports"
description: >
  Helper action to publish unit test results to a pull request or commit.
  Used by the primary workflow after downloading the generated XML files
  from parallel or sequential runs.
  This action also generates a Markdown summary from the JUnit XML and
  uploads it as an artifact for easier CI review.
inputs:
  report_path:
    description: "Pattern or path to the XML test reports (e.g. 'reports/junit/*.xml')"
    required: false
    default: "reports/junit/*.xml"
  summary_output:
    description: "Path to write the generated Markdown summary."
    required: false
    default: "reports/bdd-test-summary.md"
  upload_summary_artifact:
    description: "Whether to upload the generated summary as an artifact."
    required: false
    default: "true"
  summary_artifact_name:
    description: "Name of the uploaded summary artifact."
    required: false
    default: "bdd-test-summary"
runs:
  using: composite
  steps:
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ${{ inputs.report_path }}
        check_name: "BDD Test Results"

    - name: Generate Markdown summary
      shell: bash
      run: |
        python "${{ github.workspace }}/scripts/junit_report_summary.py" \
          --report-path "${{ inputs.report_path }}" \
          --output "${{ inputs.summary_output }}"

    - name: Upload summary artifact
      if: ${{ always() && inputs.upload_summary_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.summary_artifact_name }}
        path: ${{ inputs.summary_output }}
        retention-days: 30
        if-no-files-found: ignore
