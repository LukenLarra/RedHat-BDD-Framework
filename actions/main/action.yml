name: "RedHat BDD Framework"
description: >
  Stack-agnostic BDD test framework. Set up your runtime, install your
  project dependencies, and declare your database as a job-level service.
  Then call this action — it installs its own framework dependencies,
  runs the BDD tests, and publishes the results.
  DATABASE_URL is read from the job environment automatically.
inputs:
  service:
    description: "Service name used for artifact naming"
    required: true
  bdd_config:
    description: "Path to the BDD framework config file (relative to caller workspace)"
    required: false
    default: "framework.yml"
  artifacts_log_dir:
    description: "Directory where JUnit reports are written (relative to reports/)"
    required: false
    default: "junit"
  test_requirements:
    description: >
      Path to a requirements.txt with extra Python packages needed by the
      caller's step files. Installed into the framework venv.
      Leave empty if your steps only use the standard library or packages
      already bundled with the framework.
    required: false
    default: ""
  service_package:
    description: >
      Path to a Python package to install into the framework venv before
      running tests (e.g. a service written in Python that needs to be
      importable by the step files). Leave empty for non-Python services.
    required: false
    default: ""
  feature_file:
    description: "Specific .feature file to run (used in parallel executions to split tests by feature)"
    required: false
    default: ""
  artifact_name_suffix:
    description: "Suffix for the uploaded artifact name to prevent collisions in matrix runs"
    required: false
    default: ""
  python_version:
    description: >
      Python version to use for the BDD testing environment (e.g., '3.12').
      If empty, uses the runner's default Python.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install BDD framework dependencies
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
        TEST_REQUIREMENTS: ${{ inputs.test_requirements }}
        SERVICE_PACKAGE: ${{ inputs.service_package }}
      run: |
        REPO_ROOT="$(cd "${{ github.action_path }}/../.." && pwd)"
        echo "REPO_ROOT=${REPO_ROOT}" >> "$GITHUB_ENV"
        if [[ "${{ github.action_path }}" == /mnt/* ]]; then
          BDD_VENV=/tmp/bdd-framework-venv
        else
          BDD_VENV="${{ github.action_path }}/.venv"
        fi
        echo "BDD_VENV_PATH=${BDD_VENV}" >> "$GITHUB_ENV"
        command -v uv > /dev/null 2>&1 || python -m pip install uv --quiet
        if [[ -n "$PYTHON_VERSION" ]]; then
          uv venv --python "$PYTHON_VERSION" "${BDD_VENV}"
        else
          uv venv "${BDD_VENV}"
        fi
        uv pip install --quiet \
          --python "${BDD_VENV}/bin/python" \
          -r "${REPO_ROOT}/requirements.txt" \
          -r "${REPO_ROOT}/tests/requirements.txt"
        uv pip install --quiet \
          --python "${BDD_VENV}/bin/python" \
          "${REPO_ROOT}"
        if [[ -n "$TEST_REQUIREMENTS" ]]; then
          uv pip install --quiet \
            --python "${BDD_VENV}/bin/python" \
            -r "$TEST_REQUIREMENTS"
        fi
        if [[ -n "$SERVICE_PACKAGE" ]]; then
          uv pip install --quiet \
            --python "${BDD_VENV}/bin/python" \
            "$SERVICE_PACKAGE"
        fi
        "${BDD_VENV}/bin/playwright" install chromium
        echo "${BDD_VENV}/bin" >> "$GITHUB_PATH"

    - name: Run BDD Framework
      shell: bash
      env:
        FEATURE_FILE: ${{ inputs.feature_file }}
        BDD_CONFIG: ${{ inputs.bdd_config }}
      run: |
        if [[ -n "$FEATURE_FILE" ]]; then
          "${BDD_VENV_PATH}/bin/python" -m redhat_bdd_framework --config "$BDD_CONFIG" --feature-file "$FEATURE_FILE"
        else
          "${BDD_VENV_PATH}/bin/python" -m redhat_bdd_framework --config "$BDD_CONFIG"
        fi

    - name: Normalize report paths
      if: always()
      shell: bash
      env:
        BDD_CONFIG: ${{ inputs.bdd_config }}
        ARTIFACTS_LOG_DIR: ${{ inputs.artifacts_log_dir }}
      run: |
        SRC="$(realpath -m "$(dirname "$BDD_CONFIG")/reports/$ARTIFACTS_LOG_DIR")"
        DST="$(realpath -m "${GITHUB_WORKSPACE}/reports/$ARTIFACTS_LOG_DIR")"
        if [ -d "$SRC" ] && [ "$SRC" != "$DST" ]; then
          mkdir -p "$DST"
          cp -r "$SRC"/. "$DST/"
        fi

    - name: Upload test reports
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: bdd-test-reports-${{ inputs.service }}${{ inputs.artifact_name_suffix }}
        path: reports/${{ inputs.artifacts_log_dir }}
        retention-days: 30
        if-no-files-found: ignore
